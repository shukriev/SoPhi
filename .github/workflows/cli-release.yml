name: CLI Release

# Push a tag like `cli-v0.9.0` to publish. scripts/get-sophi.sh and scripts/get-sophi.ps1 install
# the newest `cli-v*` release, so the tag prefix is what keeps them clear of voice-tools releases.
on:
  push:
    tags: [ 'cli-v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build the shaded CLI jar
        run: mvn -B -pl sophi-cli -am package -DskipTests

      - name: Smoke test
        run: |
          mkdir dist
          cp sophi-cli/target/sophi-cli-*.jar dist/sophi.jar
          java -jar dist/sophi.jar --help
          (cd dist && sha256sum sophi.jar > sophi.jar.sha256)

      - name: Create release
        run: |
          gh release create "${{ github.ref_name }}" dist/sophi.jar dist/sophi.jar.sha256 \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
