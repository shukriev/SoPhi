name: CLI Release

# Push a tag like `cli-v1.0.0` to publish. scripts/get-sophi.sh and scripts/get-sophi.ps1 install
# the newest `cli-v*` release, so the tag prefix is what keeps them clear of voice-tools releases.
# Run it by hand (workflow_dispatch) to build and smoke-test every installer without publishing.
on:
  push:
    tags: [ 'cli-v*' ]
  workflow_dispatch:

jobs:
  jar:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # jpackage needs a plain X.Y.Z, and macOS refuses a leading 0, so cli-v0.x tags can't work.
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then version="${GITHUB_REF_NAME#cli-v}"; else version="1.0.0"; fi
          if ! echo "$version" | grep -Eq '^[1-9][0-9]*\.[0-9]+\.[0-9]+$'; then
            echo "Tag must look like cli-vX.Y.Z with X >= 1 (macOS installers reject a leading 0), got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build the shaded CLI jar
        run: mvn -B -pl sophi-cli -am package -DskipTests

      - name: Smoke test
        run: |
          mkdir dist
          cp sophi-cli/target/sophi-cli-*.jar dist/sophi.jar
          java -jar dist/sophi.jar --help

      - uses: actions/upload-artifact@v4
        with:
          name: sophi-jar
          path: dist/sophi.jar
          retention-days: 1

  macos:
    needs: jar
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    # Signs and notarizes once the Apple Developer ID credentials exist: secrets
    # MACOS_CERTIFICATES_P12 (base64 .p12 holding the Developer ID Application and Installer
    # certificates), MACOS_CERTIFICATES_PASSWORD, APPLE_ID, APPLE_APP_PASSWORD; variables
    # APPLE_TEAM_ID and APPLE_SIGNING_NAME ("Name (TEAMID)"). Until then it builds an unsigned .pkg.
    env:
      SIGN: ${{ vars.APPLE_TEAM_ID != '' }}
      PKG: out/sophi-macos-${{ matrix.arch }}.pkg
      KEYCHAIN: ${{ github.workspace }}/../signing.keychain-db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/download-artifact@v4
        with:
          name: sophi-jar
          path: dist

      - name: Import the Developer ID certificates
        if: env.SIGN == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
        run: |
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -P "$P12_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/certs.p12"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      # Notarization also inspects native libraries packed inside jars and rejects unsigned ones,
      # and jpackage only signs the app bundle. So sign them in place. The 32-bit Intel copies are
      # dropped: no current macOS can load them, and their old SDK fails notarization anyway.
      - name: Sign native libraries inside the jar
        if: env.SIGN == 'true'
        run: |
          zip -q -d dist/sophi.jar '*/Mac/x86/*'
          mkdir natives && cd natives
          unzip -q ../dist/sophi.jar '*.dylib' '*.jnilib'
          find . -type f | sed 's|^\./||' > ../natives.txt
          while read -r lib; do
            codesign --force --timestamp --options runtime --keychain "$KEYCHAIN" \
              -s "Developer ID Application: ${{ vars.APPLE_SIGNING_NAME }}" "$lib"
          done < ../natives.txt
          zip -q ../dist/sophi.jar -@ < ../natives.txt

      # packaging/macos/postinstall puts a `sophi` wrapper in /usr/local/bin.
      - name: Build .pkg
        run: |
          sign_args=()
          if [ "$SIGN" = "true" ]; then
            sign_args=(--mac-sign --mac-signing-keychain "$KEYCHAIN"
                       --mac-signing-key-user-name "${{ vars.APPLE_SIGNING_NAME }}")
          fi
          jpackage --type pkg --name sophi --app-version ${{ needs.jar.outputs.version }} \
            --vendor SoPhi --description "SoPhi agent CLI" \
            --input dist --main-jar sophi.jar \
            --java-options --enable-native-access=ALL-UNNAMED \
            --mac-package-identifier dev.sophi.cli \
            --resource-dir packaging/macos \
            "${sign_args[@]}" \
            --dest out
          mv out/sophi-*.pkg "$PKG"

      - name: Notarize and staple
        if: env.SIGN == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          auth=(--apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD")
          result="$(xcrun notarytool submit "$PKG" "${auth[@]}" --wait --output-format json)"
          echo "$result"
          status="$(echo "$result" | python3 -c 'import sys, json; print(json.load(sys.stdin)["status"])')"
          if [ "$status" != "Accepted" ]; then
            id="$(echo "$result" | python3 -c 'import sys, json; print(json.load(sys.stdin)["id"])')"
            xcrun notarytool log "$id" "${auth[@]}"
            exit 1
          fi
          xcrun stapler staple "$PKG"
          spctl --assess --type install -vv "$PKG"

      - name: Install and run it
        run: |
          sudo installer -pkg "$PKG" -target /
          /usr/local/bin/sophi --help

      - uses: actions/upload-artifact@v4
        with:
          name: sophi-macos-${{ matrix.arch }}
          path: out/sophi-macos-${{ matrix.arch }}.pkg
          retention-days: 1

  windows:
    needs: jar
    # windows-2022 ships WiX 3, the only WiX that JDK 21's jpackage can drive.
    runs-on: windows-2022
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/download-artifact@v4
        with:
          name: sophi-jar
          path: dist

      # jpackage has no option to put the app on PATH, but it accepts a replacement main.wxs. The
      # first run exports the JDK's own template; we add one PATH component to it and build again,
      # so the template always matches the JDK doing the build. The upgrade UUID must never change,
      # or a new .msi installs beside the old one instead of upgrading it.
      - name: Build .msi
        shell: pwsh
        run: |
          $common = @(
            '--type', 'msi', '--name', 'sophi', '--app-version', '${{ needs.jar.outputs.version }}',
            '--vendor', 'SoPhi', '--description', 'SoPhi agent CLI',
            '--input', 'dist', '--main-jar', 'sophi.jar',
            '--java-options', '--enable-native-access=ALL-UNNAMED',
            '--win-console', '--win-upgrade-uuid', '021F8947-BF47-4BF5-AB22-E5BD5D754672'
          )
          jpackage @common --temp wix-tmp --dest wix-first
          if ($LASTEXITCODE) { exit 1 }

          $wxs = Get-Content wix-tmp/config/main.wxs -Raw
          $featureRef = '<ComponentGroupRef Id="Files"/>'
          if (-not $wxs.Contains($featureRef) -or -not $wxs.Contains('</Product>')) {
            throw "jpackage's main.wxs changed shape; update the PATH patch in this step."
          }
          $wxs = $wxs.Replace($featureRef, "$featureRef<ComponentRef Id=`"SophiOnPath`"/>")
          $wxs = $wxs.Replace('</Product>', @'
              <DirectoryRef Id="INSTALLDIR">
                <Component Id="SophiOnPath" Guid="{855713F6-0352-4521-A2E1-FC2A98EB501C}" KeyPath="yes">
                  <CreateFolder/>
                  <Environment Id="SophiPath" Name="PATH" Value="[INSTALLDIR]" Part="last" Action="set" System="yes" Permanent="no"/>
                </Component>
              </DirectoryRef>
            </Product>
          '@)
          New-Item -ItemType Directory -Force wix-res | Out-Null
          Set-Content wix-res/main.wxs $wxs -Encoding utf8

          jpackage @common --resource-dir wix-res --dest out
          if ($LASTEXITCODE) { exit 1 }
          Move-Item (Get-Item out/sophi-*.msi) out/sophi-windows-x64.msi

      - name: Install and run it
        shell: pwsh
        run: |
          $p = Start-Process msiexec -ArgumentList '/i', 'out\sophi-windows-x64.msi', '/qn', '/l*v', 'msi.log' -Wait -PassThru
          if ($p.ExitCode) { Get-Content msi.log -Tail 60; exit 1 }
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $dir = $machinePath.Split(';') | Where-Object { $_ -and (Test-Path (Join-Path $_ 'sophi.exe')) } | Select-Object -First 1
          if (-not $dir) { throw "sophi.exe is not on the machine PATH after install: $machinePath" }
          & (Join-Path $dir 'sophi.exe') --help
          if ($LASTEXITCODE) { exit 1 }

      # SignPath Foundation signs the .msi once secret SIGNPATH_API_TOKEN and variables
      # SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG and SIGNPATH_SIGNING_POLICY_SLUG exist.
      # Tag builds only: every release-signing request waits for a manual
      # approval in SignPath, which a trial run shouldn't need.
      - name: Upload the unsigned .msi for signing
        id: unsigned
        if: github.ref_type == 'tag' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-msi
          path: out/sophi-windows-x64.msi
          retention-days: 1

      - name: Sign with SignPath
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Verify the signature
        if: steps.unsigned.outcome == 'success'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature signed/sophi-windows-x64.msi
          if ($signature.Status -ne 'Valid') { throw "Signed .msi did not verify: $($signature.StatusMessage)" }
          Move-Item signed/sophi-windows-x64.msi out/sophi-windows-x64.msi -Force

      - uses: actions/upload-artifact@v4
        with:
          name: sophi-windows-x64
          path: out/sophi-windows-x64.msi
          retention-days: 1

  release:
    if: github.ref_type == 'tag'
    needs: [jar, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: sophi-*
          merge-multiple: true

      - name: Create release
        working-directory: dist
        run: |
          for f in sophi.jar sophi-macos-arm64.pkg sophi-macos-x64.pkg sophi-windows-x64.msi; do
            sha256sum "$f" > "$f.sha256"
          done
          gh release create "${{ github.ref_name }}" * \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
