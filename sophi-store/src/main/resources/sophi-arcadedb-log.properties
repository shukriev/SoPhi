# Sophi's version of ArcadeDB's arcadedb-log.properties. EmbeddedArcadeStore.open() hands it to ArcadeDB via
# java.util.logging.config.file (checked before the classpath), so jar order doesn't matter. Changed from the original:
# - FileHandler.pattern: "./log/arcadedb.log" -> "%h/.sophi/log/arcadedb.log". The original is relative
#   to the working directory, so every project Sophi was started in got a log/ directory. %h is
#   user.home, so an isolated -Duser.home (evals/playbook) keeps its logs isolated too.
# - ConsoleHandler.level: INFO -> WARNING. INFO lines (index builds) filled every terminal and transcript.
# - FileHandler limit/count: 100 MB x 10 -> 10 MB x 3, since this now lives in the user's home.
handlers = java.util.logging.ConsoleHandler, java.util.logging.FileHandler
.level = INFO
io.undertow.level=WARNING
org.xnio.level=WARNING
org.jboss.level=WARNING
com.arcadedb.level = INFO
java.util.logging.ConsoleHandler.level = WARNING
java.util.logging.ConsoleHandler.formatter = com.arcadedb.utility.AnsiLogFormatter
java.util.logging.FileHandler.level = INFO
java.util.logging.FileHandler.pattern=%h/.sophi/log/arcadedb.log
java.util.logging.FileHandler.formatter = com.arcadedb.log.LogFormatter
java.util.logging.FileHandler.limit=10000000
java.util.logging.FileHandler.count=3
